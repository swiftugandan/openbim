# External judge for T2.2. Builders must not edit anything under judges/.
# A driver binary runs bim_geom::boolean on cases generated by check.py; check.py compares
# the results with manifold3d (volumes, coplanar-face regions) and trimesh (watertightness).
[package]
name = "judge-t2-2"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
bim-geom = { path = "../../crates/bim-geom" }
serde_json = "=1.0.140"

[profile.dev.package."*"]
opt-level = 2
