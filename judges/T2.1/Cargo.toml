# External judge for T2.1. Builders must not edit anything under judges/.
# A driver binary runs bim-geom on cases generated by check.py; check.py compares the
# results with exact rational arithmetic, shapely, trimesh and closed forms.
[package]
name = "judge-t2-1"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
bim-geom = { path = "../../crates/bim-geom" }
serde_json = "=1.0.140"

[profile.dev.package."*"]
opt-level = 2
