# Sample WASM component plugins for the T4.1 judge, built for wasm32-wasip2.
# Builders must not edit anything under judges/.
[workspace]
resolver = "2"
members = ["sample", "trap", "spin", "probe", "hog"]

[workspace.dependencies]
wit-bindgen = "=0.46.0"
serde_json = "=1.0.140"

[profile.release]
opt-level = "s"
debug = false
strip = true
