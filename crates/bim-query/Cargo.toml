[package]
name = "bim-query"
description = "Datalog over the semantic graph: parser, stratification, semi-naive evaluation, built-in relations from the document and engines"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bim-arch = { path = "../engines/arch" }
bim-doc = { path = "../bim-doc" }
bim-mep = { path = "../engines/mep" }
bim-model = { path = "../bim-model" }
bim-plugin = { path = "../bim-plugin" }
serde_json = { version = "=1.0.140", features = ["preserve_order"] }
