[package]
name = "bim-codes"
description = "Declarative code-rule packs (IBC, Eurocode, accessibility): a closed check vocabulary over rooms, openings, stairs, ramps and walls, as data reloaded on every run"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bim-arch = { path = "../../engines/arch" }
bim-doc = { path = "../../bim-doc" }
bim-model = { path = "../../bim-model" }
bim-plugin = { path = "../../bim-plugin" }
serde_json = { version = "=1.0.140", features = ["preserve_order"] }
