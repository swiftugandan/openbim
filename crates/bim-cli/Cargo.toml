[package]
name = "bim-cli"
description = "Headless bim command over the document"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "bim_cli"
path = "src/lib.rs"

[[bin]]
name = "bim"
path = "src/main.rs"

[dependencies]
bim-bcf = { path = "../standards/bcf" }
bim-doc = { path = "../bim-doc" }
bim-ifc = { path = "../standards/ifc" }
bim-model = { path = "../bim-model" }
bim-plugin = { path = "../bim-plugin" }
bim-schema = { path = "../bim-schema" }
bim-sketch = { path = "../bim-sketch" }
bim-store = { path = "../bim-store" }
bim-sync = { path = "../bim-sync" }
serde_json = { version = "=1.0.140", features = ["preserve_order"] }
